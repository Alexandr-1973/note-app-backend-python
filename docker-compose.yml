services:
  db:
    image: postgres:16-alpine
    container_name: note_db
    restart: always
    env_file:
      - ./src/.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: note_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./src/.env
    environment:
      POSTGRES_HOST: db
      PORT: 8000
      APP_MODULE: main:app
    ports:
      - "8000:8000"


volumes:
  pgdata: